<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>謝佑祥｜名片</title>
<meta name="description" content="勝利室內裝修工作室 設計總監 謝佑祥的名片，可直接存到手機，也能加 LINE 好友。">
<meta property="og:title" content="謝佑祥｜勝利室內裝修工作室">
<meta property="og:description" content="設計總監｜存名片到手機、加我 LINE">
<meta property="og:image" content="https://adan3862936.github.io/card/card.jpg">
<meta property="og:type" content="profile">
<meta name="theme-color" content="#1FA8F0">
<style>
  :root {
    --ink: #17202A;
    --paper: #FFFFFF;
    --blue: #1FA8F0;
    --blue-dark: #0B7FC2;
    --line: #06C755;
    --line-dark: #05A847;
    --muted: #5E6B78;
    --wash: #EEF7FD;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--wash);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    min-height: 100dvh;
    padding: max(12px, env(safe-area-inset-top)) 0 max(24px, env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 472px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  /* 頁籤 */
  .tabs { display: flex; gap: 8px; margin: 0 16px; padding: 4px; background: #fff; border-radius: 999px;
          box-shadow: 0 4px 14px rgba(11, 127, 194, 0.12); }
  .tab { flex: 1; appearance: none; border: 0; background: transparent; border-radius: 999px; padding: 10px 8px;
         font: inherit; font-size: 15px; font-weight: 700; color: var(--muted); cursor: pointer;
         transition: background 160ms ease, color 160ms ease; }
  .tab[aria-selected="true"] { background: var(--blue); color: #fff; }
  .tab[data-page="1"][aria-selected="true"] { background: var(--line); }
  .tab:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  /* 左右滑動的兩頁 */
  .pager { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth;
           -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .pager::-webkit-scrollbar { display: none; }
  .page { flex: 0 0 100%; scroll-snap-align: center; padding: 0 16px; display: flex; flex-direction: column; gap: 14px; }

  .card {
    display: block; width: 100%; height: auto; aspect-ratio: 1080 / 1920;
    border-radius: 20px; background: var(--paper);
    box-shadow: 0 10px 30px rgba(11, 127, 194, 0.18);
    -webkit-touch-callout: default;
  }
  .line-panel {
    background: var(--paper); border-radius: 20px; padding: 28px 22px 24px;
    box-shadow: 0 10px 30px rgba(6, 199, 85, 0.16);
    display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;
  }
  .line-panel h2 { margin: 0; font-size: 24px; letter-spacing: 0.06em; }
  .line-panel .who { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
  .qr { width: min(78vw, 300px); height: auto; aspect-ratio: 1; border-radius: 12px;
        border: 3px solid var(--line); -webkit-touch-callout: default; }

  .btn {
    display: block; width: 100%; padding: 16px 20px; border: 0; border-radius: 999px;
    color: #fff; font: inherit; font-size: 18px; font-weight: 700; letter-spacing: 0.08em;
    text-align: center; text-decoration: none; cursor: pointer;
    transition: transform 120ms ease, background 120ms ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .save { background: var(--blue); box-shadow: 0 6px 16px rgba(31, 168, 240, 0.35); }
  .save:hover { background: var(--blue-dark); }
  .add-line { background: var(--line); box-shadow: 0 6px 16px rgba(6, 199, 85, 0.35); }
  .add-line:hover { background: var(--line-dark); }

  .hint { margin: 0; font-size: 14px; line-height: 1.7; color: var(--muted); text-align: center; }
  .status { min-height: 1.4em; margin: 0; font-size: 14px; text-align: center; color: var(--blue-dark); }
  .dots { display: flex; justify-content: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 999px; background: #B9D9EE; transition: width 160ms ease, background 160ms ease; }
  .dot.on { width: 22px; background: var(--blue); }
  .dot.on.green { background: var(--line); }
  @media (prefers-reduced-motion: reduce) { .pager { scroll-behavior: auto; } .tab, .dot, .btn { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="tabs" role="tablist" aria-label="名片頁面">
    <button class="tab" role="tab" id="tab-0" data-page="0" aria-controls="page-0" aria-selected="true">我的名片</button>
    <button class="tab" role="tab" id="tab-1" data-page="1" aria-controls="page-1" aria-selected="false">加我 LINE</button>
  </div>

  <div class="pager" id="pager">
    <section class="page" id="page-0" role="tabpanel" aria-labelledby="tab-0">
      <img class="card" src="card.jpg" width="1080" height="1920"
           alt="謝佑祥名片：勝利室內裝修工作室 設計總監、土木技師背景，電話 0909-767-886，LINE ID adan3862936，台中市西屯區，winning0602.com">
      <a class="btn save" id="save" href="card.jpg" download="謝佑祥_名片.jpg">儲存名片到手機</a>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <p class="hint">iPhone：按上方按鈕後選「儲存影像」，或長按名片選「加入照片」<br>Android：按上方按鈕下載，或長按名片選「下載圖片」</p>
    </section>

    <section class="page" id="page-1" role="tabpanel" aria-labelledby="tab-1">
      <div class="line-panel">
        <h2>加我 LINE</h2>
        <p class="who">謝佑祥｜勝利室內裝修工作室<br>LINE ID：adan3862936</p>
        <img class="qr" src="line-qr.png" width="900" height="900" alt="謝佑祥的 LINE 好友 QR Code">
        <a class="btn add-line" href="https://line.me/ti/p/wrDaGu5Jnm" rel="noopener">用 LINE 加我好友</a>
      </div>
      <p class="hint">在這支手機上：直接按綠色按鈕加好友<br>幫朋友加：請對方打開 LINE「加入好友 → 行動條碼」掃上面的 QR Code</p>
    </section>
  </div>

  <div class="dots" aria-hidden="true"><span class="dot on" id="dot-0"></span><span class="dot" id="dot-1"></span></div>
</main>
<script>
(() => {
  const pager = document.getElementById('pager');
  const tabs = [...document.querySelectorAll('.tab')];
  const dots = [document.getElementById('dot-0'), document.getElementById('dot-1')];

  const show = (index) => {
    tabs.forEach((tab, i) => tab.setAttribute('aria-selected', String(i === index)));
    dots.forEach((dot, i) => { dot.classList.toggle('on', i === index); dot.classList.toggle('green', i === 1); });
  };
  // 平滑捲動；部分瀏覽器搭配 scroll-snap 會卡住，0.5 秒後沒到位就直接跳過去。
  const goTo = (index) => {
    const left = index * pager.clientWidth;
    show(index);
    pager.scrollTo({ left, behavior: 'smooth' });
    setTimeout(() => {
      if (Math.abs(pager.scrollLeft - left) > 2) {
        pager.style.scrollBehavior = 'auto';
        pager.scrollLeft = left;
        pager.style.scrollBehavior = '';
      }
    }, 500);
  };

  tabs.forEach((tab, i) => tab.addEventListener('click', () => goTo(i)));
  pager.addEventListener('scroll', () => {
    const index = Math.round(pager.scrollLeft / Math.max(1, pager.clientWidth));
    show(Math.min(Math.max(index, 0), tabs.length - 1));
  }, { passive: true });
  if (location.hash === '#line') requestAnimationFrame(() => goTo(1));

  // 存名片：優先用系統分享選單（iPhone 可「儲存影像」到相簿），不支援就走一般下載。
  const save = document.getElementById('save');
  const status = document.getElementById('status');
  save.addEventListener('click', async (event) => {
    if (!navigator.canShare || !window.File) return;
    event.preventDefault();
    try {
      const response = await fetch(save.href);
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const blob = await response.blob();
      const file = new File([blob], '謝佑祥_名片.jpg', { type: 'image/jpeg' });
      if (!navigator.canShare({ files: [file] })) { window.location.href = save.href; return; }
      await navigator.share({ files: [file], title: '謝佑祥｜名片' });
      status.textContent = '';
    } catch (error) {
      if (error && error.name === 'AbortError') return;
      status.textContent = '無法開啟分享選單，請長按名片圖片儲存。';
    }
  });
})();
</script>
</body>
</html>
